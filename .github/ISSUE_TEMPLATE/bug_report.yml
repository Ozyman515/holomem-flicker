name: Bug report
description: Something doesn't work as described in the setup guide.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the **Troubleshooting** table in [docs/SETUP.md](../blob/main/docs/SETUP.md) first.

        **Don't paste personal information** (email, phone number, account IDs, passwords, keys). Reports are public.
        **Paste text, not links or files.** Links and attachments in reports are never opened.
  - type: input
    id: app_version
    attributes:
      label: Holomem Flicker version
      description: Shown at the top of the main screen, e.g. v17.
      placeholder: v17
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Lenovo Legion Tab TB323FU, Android 14
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller
      placeholder: Razer Kishi V3 Pro (USB-C)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode?
      options:
        - Live (songs)
        - Park
        - Minigame
        - Not mode-specific (setup, updates, app screens)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: '"List input devices" output'
      description: Main screen → Live input card → **List input devices** (with the flicker started). Paste the text here.
      render: text
  - type: textarea
    id: live_input
    attributes:
      label: Live input readout (optional)
      description: The text in the Live input card while you press the buttons / move the sticks that misbehave.
      render: text
