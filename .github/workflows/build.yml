name: Build APK

on:
  # Releases only: builds when version.txt changes on main (or by hand). Ordinary pushes don't make a new version.
  push:
    branches: [main]
    paths:
      - "version.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Workflow safety check (nothing may run on issues / PRs)
        run: bash tools/check-workflows.sh

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.9"

      - name: Private keystore (from secrets, if set)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "using private keystore"
          else
            echo "::error::KEYSTORE_B64 secret is missing - refusing to build an unsigned release"
            exit 1
          fi

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          N=$(tr -d '[:space:]' < version.txt)
          echo "N=$N" >> "$GITHUB_ENV"
          if gh release view "v$N" >/dev/null 2>&1; then echo "::error::v$N already exists - bump version.txt"; exit 1; fi
          cp app/build/outputs/apk/release/app-release.apk holomem-flicker-v$N.apk
          SHA=$(sha256sum holomem-flicker-v$N.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s holomem-flicker-v$N.apk)
          printf '{\n  "version": %s,\n  "apk": "https://github.com/Ozyman515/holomem-flicker/releases/download/v%s/holomem-flicker-v%s.apk",\n  "sha256": "%s",\n  "size": %s\n}\n' "$N" "$N" "$N" "$SHA" "$SIZE" > release.json
          cat release.json

      - name: Remove the keystore (nothing after the build may see it)
        if: always()
        run: |
          if [ -n "${KEYSTORE_PATH:-}" ] && [ -f "$KEYSTORE_PATH" ]; then shred -u "$KEYSTORE_PATH" || rm -f "$KEYSTORE_PATH"; fi
          echo "KEYSTORE_PATH=" >> "$GITHUB_ENV"

      # Published with GitHub's own CLI (preinstalled on the runner) - no third-party action touches the build.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$N" \
            --title "Holomem Flicker v$N" \
            --notes "Not offered to the app until release.json is signed with the offline key (see tools/SIGNING.md). Commit: ${{ github.sha }}" \
            "holomem-flicker-v$N.apk" release.json

      - name: Save build log to ci-log branch
        if: always()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git switch --orphan ci-log-tmp
          cp /tmp/build.log build.log
          echo "v${N:-?} (run ${{ github.run_number }}) result: ${{ job.status }}" > status.txt
          git add build.log status.txt
          git commit -q -m "build log v${N:-?}"
          git push -f origin HEAD:ci-log
