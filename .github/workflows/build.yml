name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Private keystore (from secrets, if set)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "using private keystore"
          else
            echo "::error::KEYSTORE_B64 secret is missing - refusing to build an unsigned release"
            exit 1
          fi

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          N=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk holomem-flicker-v$N.apk
          SHA=$(sha256sum holomem-flicker-v$N.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s holomem-flicker-v$N.apk)
          printf '{\n  "version": %s,\n  "apk": "https://github.com/Ozyman515/holomem-flicker/releases/download/v%s/holomem-flicker-v%s.apk",\n  "sha256": "%s",\n  "size": %s\n}\n' "$N" "$N" "$N" "$SHA" "$SIZE" > release.json
          cat release.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Holomem Flicker v${{ github.run_number }}
          body: "Not offered to the app until release.json is signed with the offline key (see tools/SIGNING.md). Commit: ${{ github.sha }}"
          files: |
            holomem-flicker-v${{ github.run_number }}.apk
            release.json

      - name: Save build log to ci-log branch
        if: always()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git switch --orphan ci-log-tmp
          cp /tmp/build.log build.log
          echo "run ${{ github.run_number }} result: ${{ job.status }}" > status.txt
          git add build.log status.txt
          git commit -q -m "build log run ${{ github.run_number }}"
          git push -f origin HEAD:ci-log
